name: Build and publish Docker image

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      image_tag: v${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: dvoaviarison/ring-doorbell-notifier
          tags: |
            type=raw,value=v${{ steps.gitversion.outputs.semVer }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.gitversion.outputs.semVer }}
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"

  deploy-render:
    needs: docker
    runs-on: ubuntu-latest
    environment:
      name: render-production
    steps:
      - name: Deploy image to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: docker.io/dvoaviarison/ring-doorbell-notifier:${{ needs.docker.outputs.image_tag }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Set the RENDER_DEPLOY_HOOK_URL secret on the render-production Environment."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --get \
            --data-urlencode "imgURL=$IMAGE_URL" \
            "$RENDER_DEPLOY_HOOK_URL"
