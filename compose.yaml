services:
  ring-doorbell-notifier:
    image: dvoaviarison/ring-doorbell-notifier:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      APP_SERVER_PORT: ${APP_SERVER_PORT:-3600}
      APP_RECORDING_FOLDER: /data/recordings
    ports:
      - "${APP_SERVER_PORT:-3600}:${APP_SERVER_PORT:-3600}"
    volumes:
      - recordings:/data/recordings
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.APP_SERVER_PORT || 3600) + '/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  recordings:
