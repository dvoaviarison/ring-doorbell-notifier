<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#34303c">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sign in - Ring Notifier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
</head>
<body class="bg-light">
  <header class="app-header text-white shadow-sm">
    <div class="container">
      <div class="d-flex align-items-center header-content">
        <img src="images/apple-touch-icon.png" alt="" class="header-icon">
        <span class="fs-4">Ring Notifier</span>
      </div>
    </div>
  </header>

  <main class="container login-container py-5">
    <section class="card login-card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 card-title mb-2">Sign in with Ring</h1>
        <p class="text-muted mb-4">Use your Ring account credentials. Ring may ask for a verification code.</p>
        <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
        <form id="ringLoginForm">
          <div id="credentialsFields">
            <label for="email" class="form-label">Email</label>
            <input id="email" name="email" type="email" class="form-control mb-3" autocomplete="username" required>
            <label for="password" class="form-label">Password</label>
            <input id="password" name="password" type="password" class="form-control mb-3" autocomplete="current-password" required>
          </div>
          <div id="mfaFields" class="d-none">
            <p id="mfaPrompt" class="text-muted"></p>
            <label for="mfaCode" class="form-label">Verification code</label>
            <input id="mfaCode" name="mfaCode" type="text" inputmode="numeric" autocomplete="one-time-code" class="form-control mb-3">
          </div>
          <button id="submitLogin" type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>
      </div>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
